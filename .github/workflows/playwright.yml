name: E2E tests

on:
  workflow_call:

env:
  NODE_V: 26

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    #    services:
    #      postgres:
    #        image: postgres:16
    #        ports:
    #          - 5432:5432
    #        env:
    #          POSTGRES_DB: eighty4
    #          POSTGRES_USER: eighty4
    #          POSTGRES_PASSWORD: eighty4
    #        options: >-
    #          --health-cmd pg_isready
    #          --health-interval 5s
    #          --health-timeout 5s
    #          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@${{ env.NODE_V }}
      #    - name: sql
      #      run: |
      #        sudo apt-get install -y postgresql-client
      #        PGPASSWORD=eighty4 psql -h localhost -U eighty4 -f v001-init-schema.sql eighty4
      #      working-directory: sql
      - run: pnpm -r --filter '!@eighty4/binny-frontend' build
      # --env-file-if-exists does not seem to work in this env
      - run: touch lambdas/.env.local
      - name: playwright
        env:
          CI: true
        run: |
          pnpm exec playwright install chromium --only-shell --with-deps
          pnpm exec playwright test --project chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: .playwright/report/
          retention-days: 30
