name: 'Publish: frontend'

on:
  workflow_call:
    inputs:
      release_id:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      upload_hostname:
        required: true
        type: string

env:
  NODE_V: 26

jobs:
  publish-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@${{ env.NODE_V }}
      - run: pnpm build
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
      - name: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.release_id }}
          UPLOAD_HOSTNAME: ${{ inputs.upload_hostname }}
        run: |
          FILENAME=dist.zip
          curl --fail --silent -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN"\
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: $(file dist.zip -b --mime-type)" \
            https://$UPLOAD_HOSTNAME/repos/eighty4/binny.sh/releases/$RELEASE_ID/assets?name=frontend.zip \
            --data-binary "@dist.zip"
